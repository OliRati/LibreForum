name: LibreForum

services:
  # PHP / Symfony
  php:
    env_file:
      - .env
    build:
      context: ./docker/php
    user: "${UID:-root}:${GID:-root}"
    volumes:
      - ./backend:/var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - mysql

  # Nginx
  nginx:
    env_file:
      - .env
    image: nginx:latest
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN:-localhost}:${HTTPS_PORT:-8443}}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      php:
        condition: service_started
      frontend:
        condition: service_started
      llm:
        condition: service_started
      mercure:
        condition: service_healthy

  # MySQL
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: libreforum
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql

  # Mailhog
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  # Frontend React + Vite
  frontend:
    env_file:
      - .env
    build:
      context: ./frontend
    working_dir: /app
    user: "${UID:-root}:${GID:-root}"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: >-
      sh -c 'if [ "$$APP_ENV" = "prod" ]; then
        npm run build && npm run preview -- --host 0.0.0.0 --port 5173;
      else
        npm run dev -- --host 0.0.0.0;
      fi'
    stdin_open: true
    tty: true

  # Ollama (LLM local)
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: 10h
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # API Python (LLM)
  llm:
    env_file:
      - .env
    build:
      context: ./llm
    volumes:
      - ./llm:/app
    depends_on:
      - ollama
    ports:
      - "8000:8000"

  mercure:
    image: dunglas/mercure:v1.1.4
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:80"
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins *
        anonymous
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test \"$$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/.well-known/mercure)\" = 400",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db_data:
  ollama_data:
